<title>Personal Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.json">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --panel:#f8f8f8; --panel2:#fafafa; --border:#f0f0f0;
    --text:#000000; --muted:#999999; --sub:#666666; --body:#333333;
    --accent:#d97757; --accent-hover:#c1643f; --accent-bg:#fef5f0; --accent-border:#ffe8dc;
    --good:#788c5d; --good-bg:#f0f9f5; --good-border:#dce8e3;
    --blue:#6a9bcc; --blue-bg:#f5f9fe; --blue-border:#dce6f0;
    --warn:#c9a82d; --warn-bg:#fdf8e8; --warn-border:#f0e5bd;
    --bad:#a63244; --bad-bg:#fdf0f2;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  body{padding-bottom:76px}
  .hidden{display:none !important}
  header{padding:16px;background:var(--bg);border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:24px;font-weight:600}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  main{max-width:480px;margin:0 auto;padding:16px}
  .card{background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .card.accent{background:var(--accent-bg);border:1px solid var(--accent-border)}
  .card.good{background:var(--good-bg);border:1px solid var(--good-border)}
  .card.blue{background:var(--blue-bg);border:1px solid var(--blue-border)}
  .card.warn{background:var(--warn-bg);border:1px solid var(--warn-border)}
  .card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;font-weight:600}
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat .v{font-size:24px;font-weight:700;color:var(--accent)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
    color:var(--sub);margin:16px 0 10px}
  .section-title:first-child{margin-top:0}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;
    font-size:13px;font-family:inherit;background:var(--bg);color:var(--text)}
  textarea{resize:vertical;min-height:60px}
  label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
  .field{margin-bottom:12px}
  .row{display:flex;gap:8px}
  .row.wrap{flex-wrap:wrap}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--accent);color:#fff;border:none;padding:12px 16px;border-radius:10px;
    font-weight:600;font-size:13px}
  .btn:hover{background:var(--accent-hover)}
  .btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--border)}
  .btn.small{padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.block{width:100%}
  .empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:13px}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
  .pill.ok{background:var(--good-bg);color:var(--good)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .pill.muted{background:var(--panel);color:var(--muted)}
  .list-item{background:var(--panel);border-radius:8px;padding:12px;margin-bottom:8px}
  .list-item:last-child{margin-bottom:0}
  .list-item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .list-item .name{font-weight:600;font-size:13px}
  .list-item .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
  .subtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
  .subtabs button{flex:none;padding:7px 12px;border-radius:20px;border:1px solid var(--border);
    background:var(--bg);color:var(--sub);font-size:12px;font-weight:600;white-space:nowrap}
  .subtabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gen-block{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
  .gen-block .lang-label{font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:6px}
  .gen-block pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;line-height:1.55;margin:0;color:var(--body)}
  .flag{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:11.5px;
    margin-top:8px;font-weight:600}
  .plan-slot{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
  .plan-slot .dow{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .checklist{display:flex;align-items:center;gap:6px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase}
  td.num,th.num{text-align:right}
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
    display:flex;justify-content:space-around;align-items:center;padding:6px 0 8px;z-index:5}
  nav.tabbar button{background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding:6px 10px;color:var(--muted);font-size:10.5px}
  nav.tabbar button .ic{font-size:22px}
  nav.tabbar button.active{color:var(--accent);font-weight:600}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#191915;color:#fff;
    padding:9px 16px;border-radius:20px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);
    z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
</style>

<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   Personal Manager — Telegram Mini App (single user: Noel)

   ONE Mini App, single index.html, client-side tab routing — deliberately
   not five separate Mini Apps (rejected: janky navigation, 5x maintenance
   at solo-user scale). Tabs: Dashboard, TikTok, CFO, YouTube, Bible — all
   five always render in the nav bar even before their content is built.

   Build order (don't reorder without asking): 1) TikTok Affiliate Hub
   (this pass) 2) CFO 3) Dashboard 4) YouTube 5) Bible. CFO/YouTube/Bible
   are placeholder panels until their turn.

   TikTok Hub is entirely localStorage — no server needed for it. CFO will
   be the first tab needing a Netlify function (Google service account,
   since Telegram's WebView blocks Google's own OAuth screen) — see
   netlify/functions/lib/telegram-verify.mjs, already in place from an
   earlier capture-only prototype and reusable as-is for that.
   ========================================================================= */

/* ---------- helpers ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRM = (n) => 'RM' + (Math.round((n + Number.EPSILON) * 100) / 100)
  .toLocaleString('en-MY', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const todayISO = () => new Date().toISOString().slice(0, 10);
const daysBetween = (isoA, isoB) => Math.round((new Date(isoB) - new Date(isoA)) / 86400000);
const uid = (p) => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- storage ---------- */
const LS = {
  products: 'pmgr_tt_products_v1',
  plan: 'pmgr_tt_plan_v1',
  perf: 'pmgr_tt_perf_v1',
  compliance: 'pmgr_tt_compliance_v1',
  cfoLearned: 'pmgr_cfo_learned_v1',
  cfoQueue: 'pmgr_cfo_offline_queue_v1',
  bibleChecks: 'pmgr_bible_checks_v1',
};
function safeGet(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { toast('Storage full or unavailable.'); return false; }
}

/* =========================================================================
   TikTok Affiliate Hub — domain logic (pure functions, tested in test.js)
   ========================================================================= */

const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const ANGLES = [
  { id: 'question', label: 'Question hook' },
  { id: 'pov', label: 'POV hook' },
  { id: 'price', label: 'Price-shock hook' },
];
const LANGS = [
  { id: 'bm', label: 'BM Santai' },
  { id: 'en', label: 'English' },
  { id: 'mix', label: 'Mix' },
];

// Real enforcement 14 Aug 2026: claims must be feature-based ("safe",
// "comfortable", "easier", "guard hand handle"), never health-outcome based
// ("solves fatigue", "reduces pain", "treats X", "in 2 weeks"). This scans
// any generated or user-entered product text and flags a match rather than
// silently emitting it — the caller decides what to do with the flag.
const HEALTH_CLAIM_PATTERN = /\b(solves?|treats?|cures?|heals?|relieves?|reduces?|eliminates?|prevents?)\b.{0,25}\b(pain|fatigue|ache|inflammation|arthritis|injury|stress|condition|symptom)s?\b|\bin (just )?\d+ (days?|weeks?|hours?)\b|\bmedical(ly)?\b|\bclinically proven\b/i;
function checkHealthClaim(text) {
  const m = HEALTH_CLAIM_PATTERN.exec(text || '');
  return m ? m[0] : null;
}

function newProduct(fields) {
  return {
    id: uid('prod'),
    name: fields.name || '',
    price: fields.price || 0,
    problem: fields.problem || '',   // noun phrase: "greasy pans that never come clean"
    benefit: fields.benefit || '',   // predicate phrase: "cuts grease in one wipe"
    urgent: !!fields.urgent,         // limited-stock flag; gates urgency wording
    createdAt: Date.now(),
  };
}

// Angle hook line — the single sentence shared by the caption AND scene 1
// of the TOC script, so they read as one idea (per creator-batch-planner
// guidance), not two competing ones.
function hookLine(product, angle, lang) {
  const { name, price, problem, benefit } = product;
  if (angle === 'question') {
    if (lang === 'bm') return `Korang pernah tak ${problem}?`;
    if (lang === 'mix') return `Korang pernah tak ${problem}? So annoying kan?`;
    return `Ever dealt with ${problem}?`;
  }
  if (angle === 'pov') {
    if (lang === 'bm') return `POV: ${problem}, then ${name} masuk hidup korang`;
    if (lang === 'mix') return `POV: ${problem}, then ${name} literally saves the day`;
    return `POV: ${problem}, then ${name} enters the picture`;
  }
  // price
  if (lang === 'bm') return `RM${price} je? ${name} ni patut lagi mahal weh`;
  if (lang === 'mix') return `RM${price} only? ${name} ni worth way more than that`;
  return `Only RM${price}? ${name} should cost way more than this`;
}

function ctaLine(product, lang, urgent) {
  const stock = urgent ? (lang === 'bm' ? ' Stok terhad je ni.' : ' Limited stock only.') : '';
  if (lang === 'bm') return `Link kat bio/keranjang kuning.${stock} Grab je sebelum sold out.`;
  if (lang === 'mix') return `Link is in bio/yellow basket.${stock} Grab it before it's gone.`;
  return `Link's in bio/the yellow basket.${stock} Grab yours before it's gone.`;
}

const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

// Benefit is free text the user typed (in whatever language they wrote it
// in) — the language selector only changes the surrounding hook/CTA/price
// framing around it, not this line itself. Sentence-cased so it reads as
// its own sentence after the hook, not a lowercase fragment.
function benefitLine(product) {
  return cap(`${product.benefit}.`);
}

function priceLine(product, lang) {
  const { price } = product;
  if (lang === 'bm') return `Cuma RM${price}.`;
  if (lang === 'mix') return `Only RM${price} je.`;
  return `Just RM${price}.`;
}

// Generates one caption for one angle+language. Never emits urgency
// wording unless product.urgent is set — manufactured scarcity on an
// affiliate account is a compliance risk, not a style choice.
function generateCaption(product, angle, lang) {
  const hook = hookLine(product, angle, lang);
  const ben = benefitLine(product);
  const cta = ctaLine(product, lang, product.urgent);
  const hashtags = lang === 'en'
    ? '#TikTokMadeMeBuyIt #kitchenfinds #shopwithme'
    : '#tiktokshopmalaysia #ultramain #shopwithme';
  const text = [hook, ben, cta, hashtags].join('\n\n');
  const flaggedIn = checkHealthClaim(product.problem) || checkHealthClaim(product.benefit) || checkHealthClaim(text);
  return { angle, lang, text, flagged: !!flaggedIn, flagMatch: flaggedIn };
}

function generateAllCaptions(product) {
  const out = [];
  ANGLES.forEach(a => LANGS.forEach(l => out.push(generateCaption(product, a.id, l.id))));
  return out;
}

// Scene count from clip duration: ~3-4 sec/scene, per creator-batch-planner
// guidance (divide by ~3.5s).
function sceneCount(durationSec) {
  return Math.max(2, Math.round((Number(durationSec) || 0) / 3.5));
}

// Beat sequence per scene count is a fixed lookup, not computed on the fly
// (creator-batch-planner: "it's a small table and it makes the output
// predictable"). Beats: HOOK / PROBLEM / PRODUCT / BENEFIT / PRICE / CTA.
// Scene 1 is always HOOK (matches the caption hook); the last scene is
// always CTA.
const BEAT_PLANS = {
  2: [['HOOK', 'PROBLEM'], ['BENEFIT', 'PRICE', 'CTA']],
  3: [['HOOK', 'PROBLEM'], ['PRODUCT', 'BENEFIT'], ['PRICE', 'CTA']],
  4: [['HOOK'], ['PROBLEM', 'PRODUCT'], ['BENEFIT'], ['PRICE', 'CTA']],
  5: [['HOOK'], ['PROBLEM'], ['PRODUCT', 'BENEFIT'], ['PRICE'], ['CTA']],
};
function beatPlanFor(count) {
  if (BEAT_PLANS[count]) return BEAT_PLANS[count];
  // 6+: one beat per scene, pad extra scenes by repeating BENEFIT before CTA
  const base = ['HOOK', 'PROBLEM', 'PRODUCT', 'BENEFIT', 'PRICE', 'CTA'];
  if (count === 6) return base.map(b => [b]);
  const padded = base.slice(0, -1);
  while (padded.length < count - 1) padded.push('BENEFIT');
  padded.push('CTA');
  return padded.map(b => [b]);
}

function beatText(beat, product, angle, lang) {
  if (beat === 'HOOK') return hookLine(product, angle, lang);
  if (beat === 'PROBLEM') return product.problem;
  if (beat === 'PRODUCT') return product.name;
  if (beat === 'BENEFIT') return benefitLine(product);
  if (beat === 'PRICE') return priceLine(product, lang);
  return ctaLine(product, lang, product.urgent);
}

// Joins beat fragments into one scene line. A fragment that already ends
// in sentence punctuation (from benefitLine/priceLine/ctaLine, which are
// full sentences) gets a plain space next, so it doesn't read as
// "Sentence. — Next sentence."; a bare phrase (problem/product, no
// punctuation of its own) gets an em-dash so it still reads as connected
// rather than run together.
function joinBeats(parts) {
  let out = '';
  parts.forEach((part, i) => {
    if (i === 0) { out = part; return; }
    out += (/[.!?]$/.test(out) ? ' ' : ' — ') + part;
  });
  return out;
}

// Merges beats sharing a scene into one line, skipping anything already
// said this line (a product name often contains its own benefit word).
function generateTOC(product, angle, lang, durationSec) {
  const count = sceneCount(durationSec);
  const plan = beatPlanFor(count);
  const scenes = plan.map((beats) => {
    const seen = new Set();
    const parts = [];
    beats.forEach(b => {
      const text = (beatText(b, product, angle, lang) || '').trim();
      if (!text) return;
      const key = text.toLowerCase();
      if (seen.has(key)) return;
      seen.add(key);
      parts.push(text);
    });
    return cap(joinBeats(parts));
  });
  const flaggedIn = checkHealthClaim(scenes.join(' '));
  return { angle, lang, durationSec, sceneCount: count, scenes, flagged: !!flaggedIn, flagMatch: flaggedIn };
}

/* ---------- weekly batch planner ---------- */

function emptyPlan(weekStartISO) {
  return {
    weekStart: weekStartISO,
    slots: DOW.map(d => ({ dow: d, productId: null, angleId: null, isRepost: false, openingChanged: false })),
  };
}
function mondayOfISO(iso) {
  const d = new Date(iso + 'T00:00:00');
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}
// A repost slot that hasn't had its opening 1-3s marked changed gets
// flagged — TikTok suppresses an unmodified repost as a duplicate.
function planWarnings(plan) {
  return plan.slots
    .map((s, i) => (s.isRepost && !s.openingChanged) ? { index: i, dow: s.dow } : null)
    .filter(Boolean);
}

/* ---------- performance tracking ---------- */

// TikTok Creator Center CSV headers vary by export version/locale; match
// fuzzily rather than hardcoding one exact header row.
const PERF_COLMAP = [
  [/video.*(id|link|url)/i, 'videoId'],
  [/video.*(title|desc)/i, 'title'],
  [/post.*(time|date)|^date$/i, 'date'],
  [/views?$/i, 'views'],
  [/likes?$/i, 'likes'],
  [/comments?$/i, 'comments'],
  [/shares?$/i, 'shares'],
];
function mapPerfHeaders(headerRow) {
  return headerRow.map(h => {
    const hit = PERF_COLMAP.find(([re]) => re.test(String(h).trim()));
    return hit ? hit[1] : null;
  });
}
function parsePerfCSV(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const header = lines[0].split(',').map(s => s.trim());
  const mapped = mapPerfHeaders(header);
  return lines.slice(1).map(line => {
    const cells = line.split(',').map(s => s.trim());
    const row = {};
    mapped.forEach((key, i) => { if (key) row[key] = cells[i]; });
    row.views = Number(row.views) || 0;
    row.likes = Number(row.likes) || 0;
    row.comments = Number(row.comments) || 0;
    row.shares = Number(row.shares) || 0;
    return row;
  }).filter(r => r.date || r.videoId);
}

function newPerfEntry(fields) {
  return {
    id: uid('perf'),
    videoId: fields.videoId || '',
    productId: fields.productId || null,
    hookType: fields.hookType || 'other', // question | pov | price | other — TikTok's export doesn't know this, tag manually
    date: fields.date || todayISO(),
    views: Number(fields.views) || 0,
    likes: Number(fields.likes) || 0,
    comments: Number(fields.comments) || 0,
    shares: Number(fields.shares) || 0,
    loggedAt: Date.now(),
  };
}
// Performance only "settles" ~7 days after posting (videos take about a
// week to reach ~90% of lifetime views) — reads before that are noise.
function isSettled(entry, today) {
  return daysBetween(entry.date, today || todayISO()) >= 7;
}
function engagementRate(entry) {
  if (!entry.views) return 0;
  return (entry.likes + entry.comments + entry.shares) / entry.views;
}
// Best hook type per product, computed only from settled entries, and only
// once at least 3 posts exist for that product — one post is noise.
function bestHookType(entries, productId, today) {
  const settled = entries.filter(e => e.productId === productId && isSettled(e, today));
  if (settled.length < 3) return null;
  const byHook = {};
  settled.forEach(e => {
    byHook[e.hookType] = byHook[e.hookType] || { count: 0, totalRate: 0 };
    byHook[e.hookType].count++;
    byHook[e.hookType].totalRate += engagementRate(e);
  });
  let best = null;
  Object.entries(byHook).forEach(([hook, s]) => {
    const avg = s.totalRate / s.count;
    if (!best || avg > best.avg) best = { hook, avg, count: s.count };
  });
  return best;
}
// Re-importing must update rows rather than duplicate them — key on
// videoId (falling back to date+views if a row has no ID) plus date.
function mergePerfImport(existing, imported) {
  const byKey = new Map(existing.map(e => [(e.videoId || e.date + '|' + e.views), e]));
  imported.forEach(row => {
    const key = row.videoId || (row.date + '|' + row.views);
    const prior = byKey.get(key);
    if (prior) {
      Object.assign(prior, { views: row.views, likes: row.likes, comments: row.comments, shares: row.shares });
    } else {
      const entry = newPerfEntry(row);
      byKey.set(key, entry);
      existing.push(entry);
    }
  });
  return existing;
}

/* ---------- compliance ---------- */
function complianceStatus(compliance, today) {
  const last = compliance.lastChecked;
  if (!last) return { status: 'warn', days: null };
  const days = daysBetween(last, today || todayISO());
  return { status: days > 14 ? 'warn' : 'ok', days };
}

/* =========================================================================
   Personal CFO — domain logic

   Verbatim copy of pm-money's parser/categories (index.html) — the join key
   for the sheet's own Type/Month formulas and Budget Plan tab. Duplicated
   rather than imported for the same reason as the TikTok Hub logic above:
   no module boundary the harness can share. Keep this block, pm-money's
   copy, and netlify/functions/lib/cfo-categories.mjs in sync.

// rent/sewa rule, or the more specific rule is unreachable (first-match-wins)

const CFO_KEYWORD_MAP = [
  [/\b(salary|gaji|payroll)\b/i, "Full-time salary (net)"],
  [/\b(freelance|gig|part\s*time|part-time)\b/i, "Part-time / gig income"],

  [/\b(asb|emergency fund tier 2|ef ?2|ef tier 2)\b/i, "Emergency Fund Tier 2 (ASB)"],
  [/\b(gold)\b/i, "Gold savings for Mom"],
  [/\bsunday treat\b/i, "Sunday treat"],
  [/\b(dobi|laundry)\b/i, "Dobi (laundry)"],
  [/\b(jog|run|lari|post-?jog|post workout)\b/i, "Post-jog drinks"],
  [/\bptptn\b/i, "PTPTN voluntary payment"],
  [/\b(dinner|lunch|breakfast|makan|food|beli|groceries|nasi|roti|ayam|telur|apple|bakso|kangkung|bawang|pisang|aiskrim|mineral|buntut|drinks?|tea|coffee|americano)\b/i, "Food (daily)"],
];
const CFO_INCOME_HINT = /\b(received|receive|gave me|gift|refund|bonus|dividend|income)\b/i;
const CFO_LEARN_STOPWORDS = new Set([
  'the', 'and', 'for', 'with', 'from', 'this', 'that', 'done', 'paid', 'rm', 'a', 'an',
  'me', 'my', 'to', 'of', 'on', 'in', 'at', 'is', 'it', 'was', 'ni', 'tu', 'yang', 'dan',
]);

function cfoLearnableWords(text) {
  return (text || '').toLowerCase().match(/[a-z][a-z']{2,}/g) || [];
}
function cfoLearnFromCorrection(rawText, category, learned) {
  cfoLearnableWords(rawText).forEach(w => { if (!CFO_LEARN_STOPWORDS.has(w)) learned[w] = category; });
  return learned;
}
function cfoGuessCategory(text, learned) {
  if (learned) {
    for (const w of cfoLearnableWords(text)) {
      if (learned[w]) return { category: learned[w], confidence: 0.9 };
    }
  }
  for (const [re, cat] of CFO_KEYWORD_MAP) if (re.test(text)) return { category: cat, confidence: 0.85 };
  if (CFO_INCOME_HINT.test(text)) return { category: "Part-time / gig income", confidence: 0.35 };
  return { category: "Other / Miscellaneous", confidence: 0.3 };
}
function cfoFlagDuplicates(pending, todaysTransactions) {
  const todaysKeys = new Set((todaysTransactions || []).map(t => `${t.category}|${t.amount}`));
  pending.forEach(p => { p.duplicate = p.amount != null && todaysKeys.has(`${p.category}|${p.amount}`); });
  return pending;
}
function cfoExtractAmount(segment) {
  let m = segment.match(/rm\s*([\d,]+(?:\.\d{1,2})?)/i);
  if (m) {
    const amount = parseFloat(m[1].replace(/,/g, ''));
    const rest = (segment.slice(0, m.index) + ' ' + segment.slice(m.index + m[0].length)).trim();
    return { amount, rest };
  }
  m = segment.match(/\b(\d+(?:\.\d{1,2})?)\b/);
  if (m) {
    const amount = parseFloat(m[1]);
    const rest = (segment.slice(0, m.index) + ' ' + segment.slice(m.index + m[0].length)).trim();
    return { amount, rest };
  }
  return null;
}
function cfoSplitSegments(text) {
  return text.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
}
function cfoParseSegment(segment, learned) {
  const extracted = cfoExtractAmount(segment);
  if (!extracted || !(extracted.amount > 0)) {
    return { rawText: segment, amount: null, note: segment, category: "Other / Miscellaneous",
             type: "Expense", confidence: 0, error: 'No amount found' };
  }
  const note = extracted.rest.replace(/\s+/g, ' ').replace(/^(for|on|to)\s+/i, '').trim();
  const { category, confidence } = cfoGuessCategory(segment, learned);
  const type = cfoCatInfo(category).type;
  return { rawText: segment, amount: extracted.amount, note: note || segment,
           category, type, confidence, error: null };
}
function cfoParseInput(text, learned) {
  return cfoSplitSegments(text).map(s => cfoParseSegment(s, learned));
}

function dayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  return Math.floor((date - start) / 86400000);
}
function reflectionFor(date) {
  return BIBLE_REFLECTIONS[dayOfYear(date) % BIBLE_REFLECTIONS.length];
}

// Simple weekday reading plan: one chapter of Matthew (28 chapters) per
// weekday (Mon-Sat), cycling once the book is finished; Sunday is a
// reflection day, not a reading day, matching the mockup's "Sunday -
// Reflection" row.
const READING_BOOK = 'Matthew';
const READING_TOTAL_CHAPTERS = 28;
const READING_EPOCH = new Date(2026, 0, 5); // a Monday, week 0 day 0 of the cycle
function readingPlanForWeek(date) {
  const monday = new Date(date);
  const dow = monday.getDay(); // 0=Sun..6=Sat
  monday.setDate(monday.getDate() + (dow === 0 ? -6 : 1 - dow));
  const weekIndex = Math.floor((monday - READING_EPOCH) / (7 * 86400000));
  return DOW.map((label, i) => {
    const d = new Date(monday); d.setDate(d.getDate() + i);
    const iso = todayISOFor(d);
    if (label === 'Sun') return { dow: label, iso, label: 'Reflection', isReading: false };
    const chapterIndex = (((weekIndex * 6 + i) % READING_TOTAL_CHAPTERS) + READING_TOTAL_CHAPTERS) % READING_TOTAL_CHAPTERS;
    return { dow: label, iso, label: `${READING_BOOK} ${chapterIndex + 1}`, isReading: true };
  });
}
function todayISOFor(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Last-7-days views/engagements across all products, for the Dashboard's
// TikTok snapshot card — deliberately not gated by the 7-day "settled"
// rule (that rule is about trusting a single video's numbers for
// hook-attribution insights; a rough week-over-week total is fine to show
// immediately).
function weeklyPerfSnapshot(perf, today) {
  const cutoff = today || todayISO();
  return perf.reduce((acc, e) => {
    if (daysBetween(e.date, cutoff) > 7) return acc;
    acc.views += e.views;
    acc.engagements += e.likes + e.comments + e.shares;
    return acc;
  }, { views: 0, engagements: 0 });
}

      <pre>${esc(tocText)}</pre>
      ${toc.flagged ? `<div class="flag">⚠ Possible health-outcome claim — rephrase before posting.</div>` : ''}
    </div>
  `;
}

function renderTTPerformance() {
  const today = todayISO();
  const rows = [...state.perf].sort((a, b) => b.date.localeCompare(a.date)).map(e => {
    const product = state.products.find(p => p.id === e.productId);
    const settled = isSettled(e, today);
    return `<tr>
      <td>${esc(e.date)}${!settled ? ' <span class="pill muted">settling</span>' : ''}</td>
      <td>${esc(product ? product.name : '—')}</td>
      <td>${esc(e.hookType)}</td>
      <td class="num">${e.views}</td>
      <td class="num">${(engagementRate(e) * 100).toFixed(1)}%</td>
    </tr>`;
  }).join('');

  const insights = state.products.map(p => {
    const best = bestHookType(state.perf, p.id, today);
    return best ? `<div class="list-item"><div class="name">${esc(p.name)}</div>
      <div class="meta">Best hook so far: <b>${esc(best.hook)}</b> (${(best.avg * 100).toFixed(1)}% avg engagement, ${best.count} posts)</div></div>` : '';
  }).filter(Boolean).join('');

  return `
    <div class="card">
      <div class="card-title">Import CSV</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">From TikTok Creator Center's analytics export (past 7 days). Re-importing updates existing rows instead of duplicating.</p>
      <input type="file" id="perf-csv-file" accept=".csv,text/csv">
      <button class="btn block" style="margin-top:8px" data-action="import-perf-csv">Import</button>
    </div>
    <div class="section-title">Best hook per product (3+ settled posts)</div>
    ${insights || `<div class="empty">Not enough settled data yet.</div>`}
    <div class="section-title">Log</div>
    ${state.perf.length ? `<table><tr><th>Date</th><th>Product</th><th>Hook</th><th class="num">Views</th><th class="num">Eng.</th></tr>${rows}</table>` : `<div class="empty">No performance data yet.</div>`}
  `;
}

function renderTTCompliance() {
  const cs = complianceStatus(state.compliance);
  return `
    <div class="card ${cs.status === 'ok' ? 'good' : 'warn'}">
      <div class="card-title">${cs.status === 'ok' ? '✅' : '⚠️'} Policy status</div>
      <p style="font-size:13px;margin-bottom:8px">${state.compliance.lastChecked ? `Last checked ${esc(state.compliance.lastChecked)} (${cs.days} day${cs.days === 1 ? '' : 's'} ago)` : 'Never checked yet.'}</p>
      <button class="btn small" data-action="mark-compliance-checked">Mark reviewed today</button>
    </div>
    <div class="section-title">The hard rule (enforcement: 14 Aug 2026)</div>
    <div class="card">
      <p style="font-size:12.5px;margin-bottom:8px"><b>Feature-based claims — OK:</b> "safe", "comfortable", "easier", "guard hand handle".</p>
      <p style="font-size:12.5px;color:var(--bad)"><b>Health-outcome claims — never:</b> "solves fatigue", "reduces pain", "treats condition", specific timeframes like "in 2 weeks".</p>
      <p style="font-size:11.5px;color:var(--muted);margin-top:8px">The Generate tab scans every caption and script for this pattern automatically and flags a match — it won't silently post it, but it also won't catch every phrasing, so read before posting.</p>
    </div>
  `;
}

/* ---------- CFO tab render + network ---------- */

async function fetchCFOStatus() {
  state.cfo.loading = true; state.cfo.error = null; render();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const res = await fetch('/.netlify/functions/cfo-status', {
      headers: { 'X-Telegram-Init-Data': tg ? tg.initData : '' },
      signal: controller.signal,
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Server responded ${res.status}`);
    state.cfo.status = body;
  } catch (e) {
    state.cfo.error = e.message || 'Could not reach the CFO backend.';
  } finally {
    clearTimeout(timer);
    state.cfo.loading = false;
    render();
  }
}

function cfoPendingItemHTML(p, i) {
  const opts = CFO_CATEGORY_NAMES.map(n =>
    `<option value="${esc(n)}" ${n === p.category ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const info = cfoCatInfo(p.category);
  const typeBadge = `<span class="pill ${info.type === 'Income' ? 'ok' : 'bad'}">${info.type}</span>`;
  const reviewBadge = p.confidence < 0.5 ? `<span class="pill warn">check category</span>` : '';
  const dupBadge = p.duplicate ? `<span class="pill warn">possible duplicate</span>` : '';
  const errorLine = p.error ? `<div style="color:var(--bad);font-size:11.5px;margin-top:4px">⚠ ${esc(p.error)} — edit amount below</div>` : '';
  return `
    <div class="list-item" data-pending-index="${i}">
      <div class="top">
        <div class="name">${p.amount != null ? esc(fmtRM(p.amount)) : '—'}</div>
        <div>${typeBadge}${reviewBadge}${dupBadge}</div>
      </div>
      <div class="meta">"${esc(p.rawText)}"</div>
      ${errorLine}
      <input type="number" step="0.01" min="0" placeholder="Amount (RM)" style="margin-top:8px"
        value="${p.amount != null ? p.amount : ''}" data-action="cfo-edit-amount" data-index="${i}">
      <select data-action="cfo-edit-category" data-index="${i}" style="margin-top:6px">${opts}</select>
      <input type="text" placeholder="Note" style="margin-top:6px" value="${esc(p.note)}"
        data-action="cfo-edit-note" data-index="${i}">
      <button class="btn secondary small" style="margin-top:8px" data-action="cfo-remove-pending" data-index="${i}">Remove this line</button>
    </div>`;
}

function renderCFO() {
  const el = document.getElementById('cfo-content');
  const c = state.cfo;

  if (c.loading && !c.status) { el.innerHTML = `<div class="empty">Loading…</div>`; return; }
  if (c.error && !c.status) {
    el.innerHTML = `
      <div class="card warn">
        <div class="card-title">⚠️ Couldn't reach the CFO backend</div>
        <p style="font-size:12.5px;margin-bottom:10px">${esc(c.error)}</p>
        <p style="font-size:11.5px;color:var(--muted);margin-bottom:10px">If this is the first run, the Netlify service account and env vars (TELEGRAM_BOT_TOKEN, GOOGLE_SERVICE_ACCOUNT_KEY) likely aren't set up yet.</p>
        <button class="btn small" data-action="cfo-retry">Retry</button>
      </div>`;
    return;
  }

  const s = c.status || { income: 0, expense: 0, balance: 0, byCategory: {}, budgets: {}, recent: [] };
  const pendingHTML = c.pending.length ? `
    <div>${c.pending.map(cfoPendingItemHTML).join('')}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn secondary" data-action="cfo-cancel-pending">Cancel</button>
      <button class="btn block" data-action="cfo-save-pending">${c.saving ? 'Saving…' : 'Save all'}</button>
    </div>` : '';

  const breakdownRows = Object.entries(s.byCategory)
    .sort(([, a], [, b]) => b - a)
    .map(([cat, amount]) => {
      const budget = s.budgets && s.budgets[cat];
      const pct = budget ? Math.min(100, Math.round((amount / budget) * 100)) : 0;
      return `
      <div style="margin-bottom:12px">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;color:var(--sub)">${esc(cat)}</span>
          <span style="font-size:12px;font-weight:600">${esc(fmtRM(amount))}${budget ? ` / ${esc(fmtRM(budget))}` : ''}</span>
        </div>
        ${budget ? `<div style="width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${amount > budget ? 'var(--bad)' : 'var(--accent)'}"></div></div>` : ''}
      </div>`;
    }).join('');

  const recentRows = (s.recent || []).map(t => `
    <div class="list-item">
      <div class="top">
        <div>
          <div class="name">${esc(t.category)}</div>
          <div class="meta">${esc(t.date)}${t.note ? ' · ' + esc(t.note) : ''}</div>
        </div>
        <div style="font-weight:700;color:${t.type === 'Income' ? 'var(--good)' : 'var(--accent)'}">${t.type === 'Income' ? '+' : '−'}${esc(fmtRM(t.amount))}</div>
      </div>
    </div>`).join('');

  const queueLen = c.offlineQueue.length;

  el.innerHTML = `
    <div class="card blue">
      <div class="card-title">💰 This month</div>
      <div class="stat-row">
        <div class="stat"><div class="v" style="color:var(--good)">${esc(fmtRM(s.income))}</div><div class="l">Income</div></div>
        <div class="stat"><div class="v">${esc(fmtRM(s.expense))}</div><div class="l">Expenses</div></div>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.05);font-size:13px">
        <b>Balance:</b> <span style="color:${s.balance >= 0 ? 'var(--good)' : 'var(--bad)'};font-weight:700">${esc(fmtRM(s.balance))}</span>
      </div>
    </div>

    ${queueLen ? `<div class="flag" style="margin-bottom:12px">⚠ ${queueLen} transaction(s) saved offline — will sync automatically once the backend is reachable.</div>` : ''}

    <div class="section-title">Add transaction(s)</div>
    <div class="card">
      <textarea id="cfo-capture-input" placeholder="dinner rm10, telur rm12&#10;received salary 1900"></textarea>
      <button class="btn block" style="margin-top:8px" data-action="cfo-parse-input">Parse</button>
      ${pendingHTML}
    </div>

    <div class="section-title">Spending by category</div>
    ${breakdownRows || `<div class="empty">Nothing logged this month yet.</div>`}

    <div class="section-title">Recent transactions</div>
    ${recentRows || `<div class="empty">No transactions yet.</div>`}
  `;
}

function doCFOParseInput() {
  const textarea = document.getElementById('cfo-capture-input');
  const text = textarea.value.trim();
  if (!text) return;
  const pending = cfoParseInput(text, state.cfo.learned);
  const todays = (state.cfo.status && state.cfo.status.today) || [];
  state.cfo.pending = cfoFlagDuplicates(pending, todays);
  render();
}
function doCFORemovePending(i) { state.cfo.pending.splice(i, 1); render(); }
function doCFOCancelPending() { state.cfo.pending = []; render(); }

async function doCFOSavePending() {
  if (state.cfo.saving) return;
  const bad = state.cfo.pending.filter(p => !(p.amount > 0));
  if (bad.length) { toast('Fix the amount on the highlighted line(s) first.'); return; }
  if (!state.cfo.pending.length) return;

  const today = todayISO();
  const batch = state.cfo.pending.map(p => ({ date: today, category: p.category, amount: p.amount, note: p.note }));

  state.cfo.saving = true; render();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  let queued = false;
  try {
    const res = await fetch('/.netlify/functions/cfo-save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg ? tg.initData : '', transactions: batch }),
      signal: controller.signal,
    });
    if (!res.ok) { const b = await res.json().catch(() => ({})); throw new Error(b.error || `Server responded ${res.status}`); }
    toast('Saved to your sheet.');
  } catch (e) {
    queued = true;
    state.cfo.offlineQueue = state.cfo.offlineQueue.concat(batch);
    safeSet(LS.cfoQueue, state.cfo.offlineQueue);
    toast('Saved offline — will sync once the backend is reachable.');
  } finally {
    clearTimeout(timer);
  }

  state.cfo.pending = [];
  document.getElementById('cfo-capture-input') && (document.getElementById('cfo-capture-input').value = '');
  state.cfo.saving = false;
  if (!queued) await fetchCFOStatus(); else render();
}

async function flushCFOQueue() {
  if (!state.cfo.offlineQueue.length) return;
  const batch = state.cfo.offlineQueue;
  try {
    const res = await fetch('/.netlify/functions/cfo-save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg ? tg.initData : '', transactions: batch }),
    });
    if (!res.ok) return;
    state.cfo.offlineQueue = [];
    safeSet(LS.cfoQueue, []);
    toast(`Synced ${batch.length} queued transaction(s).`);
    if (state.tab === 'cfo') await fetchCFOStatus(); else render();
  } catch (e) { /* still offline — leave the queue as-is */ }
}

/* ---------- Bible tab render ---------- */

function renderBible() {
  const today = new Date();
  const r = reflectionFor(today);
  const plan = readingPlanForWeek(today);
  const rows = plan.map(day => {
    const done = !!state.bible.checks[day.iso];
    const isToday = day.iso === todayISOFor(today);
    return `
      <label class="row" style="justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);${isToday ? 'font-weight:600' : ''}">
        <span style="font-size:12.5px;color:${day.isReading ? 'var(--body)' : 'var(--muted)'}">${day.dow} — ${esc(day.label)}${isToday ? ' (today)' : ''}</span>
        <input type="checkbox" data-action="bible-toggle" data-iso="${day.iso}" ${done ? 'checked' : ''} style="width:auto">
      </label>`;
  }).join('');

  document.getElementById('bible-content').innerHTML = `
    <div class="card" style="background:linear-gradient(135deg,#fafafa,#fff);text-align:center;padding:28px 20px">
      <p style="font-size:16px;line-height:1.6;font-weight:500;margin-bottom:10px">"${esc(r.verse)}"</p>
      <p style="font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.03em">${esc(r.ref)}</p>
    </div>
    <div class="section-title">Today's reflection</div>
    <div class="card" style="border-left:3px solid var(--accent);font-size:12.5px;line-height:1.6;color:var(--body)">
      ${esc(r.reflection)}
    </div>
    <div class="section-title">This week's reading — ${esc(READING_BOOK)}</div>
    <div class="card">${rows}</div>
  `;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- actions ---------- */
function doAddProduct() {
  const name = document.getElementById('pf-name').value.trim();
  const price = parseFloat(document.getElementById('pf-price').value) || 0;
  const problem = document.getElementById('pf-problem').value.trim();
  const benefit = document.getElementById('pf-benefit').value.trim();
  const urgent = document.getElementById('pf-urgent').value === '1';
  if (!name || !problem || !benefit) { toast('Fill in name, problem, and benefit.'); return; }
  state.products.push(newProduct({ name, price, problem, benefit, urgent }));
  safeSet(LS.products, state.products);
  toast('Product added.');
  render();
}
function doRemoveProduct(id) {
  state.products = state.products.filter(p => p.id !== id);
  safeSet(LS.products, state.products);
  state.plan.slots.forEach(s => { if (s.productId === id) s.productId = null; });
  safeSet(LS.plan, state.plan);
  render();
}
function doImportPerfCSV() {
  const input = document.getElementById('perf-csv-file');
  const file = input.files && input.files[0];
  if (!file) { toast('Choose a CSV file first.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parsePerfCSV(String(reader.result));
    if (!rows.length) { toast('No rows found in that CSV.'); return; }
    state.perf = mergePerfImport(state.perf, rows);
    safeSet(LS.perf, state.perf);
    toast(`Imported ${rows.length} row(s).`);
    render();
  };
  reader.readAsText(file);
}

/* ---------- event delegation ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'switch-tab') {
    state.tab = el.dataset.tab;
    render();
    if (state.tab === 'cfo' && !state.cfo.status && !state.cfo.loading) fetchCFOStatus();
  }
  else if (a === 'tt-subtab') { state.ttSubtab = el.dataset.sub; render(); }
  else if (a === 'add-product') doAddProduct();
  else if (a === 'remove-product') doRemoveProduct(el.dataset.id);
  else if (a === 'import-perf-csv') doImportPerfCSV();
  else if (a === 'mark-compliance-checked') {
    state.compliance = { lastChecked: todayISO() };
    safeSet(LS.compliance, state.compliance);
    toast('Marked reviewed.');
    render();
  }
  else if (a === 'cfo-retry') fetchCFOStatus();
  else if (a === 'cfo-parse-input') doCFOParseInput();
  else if (a === 'cfo-save-pending') doCFOSavePending();
  else if (a === 'cfo-cancel-pending') doCFOCancelPending();
  else if (a === 'cfo-remove-pending') doCFORemovePending(Number(el.dataset.index));
  else if (a === 'dash-load-cfo') fetchCFOStatus();
});

document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'cfo-edit-amount') {
    state.cfo.pending[Number(el.dataset.index)].amount = el.value === '' ? null : parseFloat(el.value);
  } else if (a === 'cfo-edit-note') {
    state.cfo.pending[Number(el.dataset.index)].note = el.value;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'plan-product') {
    state.plan.slots[Number(el.dataset.index)].productId = el.value || null;
    safeSet(LS.plan, state.plan); render();
  } else if (a === 'plan-angle') {
    state.plan.slots[Number(el.dataset.index)].angleId = el.value || null;
    safeSet(LS.plan, state.plan); render();
  } else if (a === 'plan-repost') {
    const slot = state.plan.slots[Number(el.dataset.index)];
    slot.isRepost = el.checked;
    if (!el.checked) slot.openingChanged = false;
    safeSet(LS.plan, state.plan); render();
  } else if (a === 'plan-opening') {
    state.plan.slots[Number(el.dataset.index)].openingChanged = el.checked;
    safeSet(LS.plan, state.plan); render();
  } else if (a === 'gen-product') {
    state.genProductId = el.value; render();
  } else if (a === 'gen-duration') {
    state.genDuration = Number(el.value) || 15; render();
  } else if (a === 'cfo-edit-category') {
    const i = Number(el.dataset.index);
    const p = state.cfo.pending[i];
    p.category = el.value;
    p.type = cfoCatInfo(el.value).type;
    p.confidence = 1; // user-confirmed
    cfoLearnFromCorrection(p.rawText, el.value, state.cfo.learned);
    safeSet(LS.cfoLearned, state.cfo.learned);
    render();
  } else if (a === 'bible-toggle') {
    if (el.checked) state.bible.checks[el.dataset.iso] = true;
    else delete state.bible.checks[el.dataset.iso];
    safeSet(LS.bibleChecks, state.bible.checks);
  }
});

/* ---------- Telegram WebApp bridge ---------- */
const tg = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) || null;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#ffffff'); } catch (e) {} }

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('online', flushCFOQueue);
}
flushCFOQueue();
fetchCFOStatus(); // warms the Dashboard's CFO card even if the user never opens the CFO tab directly
render();
</script>
